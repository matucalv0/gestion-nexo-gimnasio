<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO · Gestionar Ejercicios</title>
    <link rel="icon" type="image/png" href="../assets/nexologo.png" />

    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <meta name="view-transition" content="same-origin" />
</head>

<body class="text-gray-100 min-h-screen font-sans selection:bg-[var(--orange)] selection:text-white">

    <!-- ALERTAS -->
    <div id="alert-container" class="fixed top-4 right-4 max-w-md z-50"></div>

    <main class="flex justify-center min-h-screen p-6 pt-8">
        <div class="w-full max-w-5xl">

            <!-- HEADER -->
            <header class="page-header mb-6">
                <div class="page-header-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.429 9.75L2.25 12l4.179 2.25m0-4.5l5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0l4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0l-5.571 3-5.571-3" />
                    </svg>
                </div>
                <div class="page-header-content">
                    <h1 class="page-header-title">Ejercicios</h1>
                    <p class="page-header-subtitle">Catálogo de movimientos</p>
                </div>
                <div class="page-header-actions">
                    <button id="btnNuevoEjercicio" class="btn-action-primary btn-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        <span>Nuevo Ejercicio</span>
                    </button>
                </div>
            </header>

            <!-- CARD PRINCIPAL (MASTER TABLE) -->
            <div class="master-table-card">
                <!-- Toolbar con filtros -->
                <div class="master-toolbar">
                    <div>
                        <h2 class="text-lg font-bold text-white tracking-tight m-0">Catálogo de Movimientos</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Ejercicios musculares y rutinas guiadas</p>
                    </div>

                    <div class="flex flex-wrap items-center gap-3">
                        <div class="search-box-wrapper min-w-[200px]">
                            <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="text" id="busquedaInput" placeholder="Buscar por nombre..." class="search-box-input" autocomplete="off">
                        </div>
                        <select id="filtroGrupo" class="filter-select text-xs py-2 bg-[#121212] border-white/10 text-white rounded-xl" aria-label="Filtrar por grupo muscular">
                            <option value="">Todos los grupos</option>
                            <!-- Options injected by JS -->
                        </select>
                    </div>
                </div>

                <!-- TABLA -->
                <div class="master-table-wrapper">
                    <table class="master-table">
                        <thead>
                            <tr>
                                <th>Ejercicio</th>
                                <th>Grupo Muscular</th>
                                <th>Video</th>
                                <th class="text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEjerciciosBody">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>

                    <!-- Empty state -->
                    <div id="emptyStateEjercicios" class="hidden py-16 text-center text-gray-500 italic text-sm">
                        <p class="font-medium text-gray-400">No se encontraron ejercicios</p>
                        <p class="text-xs text-gray-600 mt-1">Prueba seleccionando otro grupo muscular o agregando un nuevo ejercicio</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL NUEVO/EDITAR EJERCICIO -->
    <div id="modalEjercicio" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content max-w-lg">
            <!-- Header -->
            <div class="modal-header">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-[var(--orange)]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <h3 id="modalTitle" class="modal-title">Nuevo Ejercicio</h3>
                </div>
                <button id="closeModalBtn" class="modal-close">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <div class="form-container">
                    <input type="hidden" id="ejercicioId">

                    <div class="form-group">
                        <label class="form-label" for="nombreInput">Nombre <span class="text-red-400">*</span></label>
                        <input type="text" id="nombreInput" class="form-input" placeholder="Ej: Press Banca">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="grupoInput">Grupo Muscular <span class="text-red-400">*</span></label>
                        <select id="grupoInput" class="form-input">
                            <option value="">-- Seleccionar --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="videoInput">URL Video</label>
                        <input type="text" id="videoInput" class="form-input" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="descripcionInput">Descripción</label>
                        <textarea id="descripcionInput" rows="3" class="form-input resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <button id="cancelBtn" class="btn-outline">Cancelar</button>
                        <button id="saveBtn" class="btn-action-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL VIDEO -->
    <div id="modalVideo" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content max-w-2xl">
            <div class="modal-header">
                <h3 id="videoModalTitle" class="modal-title">Demostración</h3>
                <button id="closeVideoModalBtn" class="modal-close">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden">
                    <iframe id="videoIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/pages/ejercicios.js"></script>
    <script src="../js/ui/sidebar.js"></script>
</body>

</html>
