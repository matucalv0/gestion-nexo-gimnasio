<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO · Iniciar Sesión</title>
  <link rel="icon" type="image/png" href="assets/nexologo.png" />

  <!-- Tailwind -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main CSS (provides variables and background) -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
  <meta name="view-transition" content="same-origin" />
</head>

<body class="login-body">

  <main class="login-container">

    <!-- Header Logo & Title -->
    <div class="login-header">
      <img src="assets/nexologo.png" alt="NEXO" class="login-logo">
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Hacemos que pase</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <form id="loginForm" class="login-form" autocomplete="on">

        <!-- Username Field -->
        <div class="login-field">
          <label for="username" class="login-label">Usuario</label>
          <div class="input-icon-wrapper">
            <svg class="input-lead-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <input type="text" id="username" name="username" placeholder="Ingresá tu usuario" required
              autocomplete="username" autofocus
              class="login-input">
          </div>
        </div>

        <!-- Password Field -->
        <div class="login-field">
          <label for="password" class="login-label">Contraseña</label>
          <div class="input-icon-wrapper">
            <svg class="input-lead-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
              </path>
            </svg>
            <input type="password" id="password" name="password" placeholder="Ingresá tu contraseña" required
              autocomplete="current-password"
              class="login-input has-trailing-btn">
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" title="Mostrar/ocultar contraseña" aria-label="Mostrar/ocultar contraseña" tabindex="-1">
              <!-- Eye open icon -->
              <svg id="eyeIconOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye closed icon (hidden by default) -->
              <svg id="eyeIconClosed" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="login-btn group">
          <span id="btnText">Ingresar</span>
          <svg id="btnArrow" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
          <div id="btnSpinner" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin hidden"></div>
        </button>

      </form>
    </div>

    <!-- Error Alert Box -->
    <div id="loginError" class="login-error-container" role="alert">
      <svg class="w-4 h-4 shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="loginErrorText" class="flex-1"></span>
    </div>

  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>

</html>
