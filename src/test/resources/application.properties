# Usar PostgreSQL real para tests (misma que desarrollo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usamos Flyway para asegurar que la estructura existe (igual que en dev)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cookie security
app.cookie.secure=false

jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=3600000

# Logging reducido para tests
logging.level.org.hibernate.SQL=WARN

# Configuracion de Correo para tests (para crear el bean JavaMailSender y evitar fallos de inyeccion)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@nexo.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Desactivar ejecucion programada automatica del cron durante tests
cron.membresia.notificacion=-
